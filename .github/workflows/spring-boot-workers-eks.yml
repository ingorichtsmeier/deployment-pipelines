name: spring-boot-workers-eks

on:
  push:
    branches: [master, action-dev]   # TODO: drop action-dev once merged to master
    paths:
      - 'process-applications/spring-boot-workers/**'
      - 'platform/eks/k8s/spring-boot-workers-deployment.yaml'
      - '.github/workflows/spring-boot-workers-eks.yml'
  workflow_dispatch: {}

env:
  APP_DIR: process-applications/spring-boot-workers
  MANIFEST: platform/eks/k8s/spring-boot-workers-deployment.yaml
  ECR_REPOSITORY: spring-boot-workers

jobs:
  deploy-dev:
    runs-on: ubuntu-latest   # TODO: switch back to [self-hosted, camunda-eks] once ARC is installed
    environment: dev
    permissions:
      contents: read
      id-token: write   # OIDC federation to AWS, no long-lived keys
      actions: write    # delete the previous failed-run artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ env.APP_DIR }}/pom.xml

      - name: Lint BPMN/DMN
        working-directory: ${{ env.APP_DIR }}
        run: npx --yes bpmnlint@latest src/main/resources/processes/*.bpmn

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, test, and build container image
        working-directory: ${{ env.APP_DIR }}
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: mvn -B spring-boot:build-image -Dspring-boot.build-image.imageName=$IMAGE

      - name: Delete previous test-report artifact
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'test-reports-${{ github.job }}';
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
            });
            for (const artifact of data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Upload test and coverage reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.job }}
          path: |
            ${{ env.APP_DIR }}/target/surefire-reports/
            ${{ env.APP_DIR }}/target/coverage-report/
          retention-days: 14

      - name: Push image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: docker push "$IMAGE"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Create/update Camunda client credentials secret
        run: |
          kubectl create secret generic spring-boot-workers-camunda-client \
            --namespace depl-dev \
            --from-literal=client-id="${{ vars.CAMUNDA_CLIENT_ID }}" \
            --from-literal=client-secret="${{ secrets.CAMUNDA_CLIENT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to dev cluster
        shell: bash   # ensures -o pipefail, so a failing envsubst can't be masked by kubectl's exit code
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          NAMESPACE: depl-dev
        run: envsubst < "$MANIFEST" | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/spring-boot-workers -n depl-dev --timeout=180s

  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest   # TODO: switch back to [self-hosted, camunda-eks] once ARC is installed
    environment: qa   # configured with required reviewers in repo settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Create/update Camunda client credentials secret
        run: |
          kubectl create secret generic spring-boot-workers-camunda-client \
            --namespace qa \
            --from-literal=client-id="${{ vars.CAMUNDA_CLIENT_ID }}" \
            --from-literal=client-secret="${{ secrets.CAMUNDA_CLIENT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy the same image promoted from dev
        shell: bash   # ensures -o pipefail, so a failing envsubst can't be masked by kubectl's exit code
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          NAMESPACE: qa
        run: envsubst < "$MANIFEST" | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/spring-boot-workers -n qa --timeout=180s
